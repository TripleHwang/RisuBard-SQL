# Neutral local identifiers keep this fork independent of the upstream registry.
# Change them deliberately if this is deployed beside an existing installation.
name: risubard-standalone

services:
  risubard:
    container_name: risubard-standalone
    build: .
    image: risubard-standalone:local
    restart: always
    ports:
      - 6001:6001
    volumes:
      - risubard-standalone-save:/app/save

volumes:
  risubard-standalone-save:
    name: risubard-standalone-save
