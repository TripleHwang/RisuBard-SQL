# Neutral local identifiers keep this fork independent of the upstream registry.
# Change them deliberately if this is deployed beside an existing installation.
name: risubard-sql

services:
  risubard-sql:
    container_name: risubard-sql
    build: .
    image: risubard-sql:local
    restart: always
    ports:
      - 6001:6001
    environment:
      RISU_UPDATE_REPOSITORY: TripleHwang/RisuBard-SQL
      RISU_RELEASE_ARTIFACT_PREFIX: RisuBard-SQL
    volumes:
      - risubard-sql-save:/app/save

volumes:
  risubard-sql-save:
    name: risubard-sql-save
