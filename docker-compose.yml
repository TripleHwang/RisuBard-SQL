# Neutral local identifiers keep this fork independent of the upstream registry.
# Change them deliberately if this is deployed beside an existing installation.
name: risuvault

services:
  risuvault:
    container_name: risuvault
    build: .
    image: risuvault:local
    restart: always
    ports:
      - 6001:6001
    environment:
      RISU_UPDATE_REPOSITORY: TripleHwang/RisuVault
      RISU_RELEASE_ARTIFACT_PREFIX: RisuVault
    volumes:
      - risuvault-save:/app/save

volumes:
  risuvault-save:
    name: risuvault-save
